  label_slackmine_admin_jobs: "Queue and tasks"
  text_slackmine_admin_jobs: "Queue status, execution history and test notifications are available only when using Sidekiq. Only Slackmine jobs are shown. History starts after this feature is installed and retains the latest 100 executions for up to seven days. Completed means job execution finished, not delivery verification for regular notifications. Times indicate enqueue, start, schedule, retry, failure or completion."
  text_slackmine_admin_queue_summary: "slack queue total: %{count}; queue latency: %{seconds} seconds"
  text_slackmine_admin_jobs_truncated: "Only the first 500 entries in each queue or job set are scanned. Displayed counts are not totals."
  label_slackmine_admin_jobs_current: "Current tasks"
  label_slackmine_admin_jobs_history: "Recent executions"
  label_slackmine_admin_job_job: "Job / ID"
  label_slackmine_admin_job_state: "State"
