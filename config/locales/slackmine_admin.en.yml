  label_slackmine_admin_test_notification: "Send test notification"
  text_slackmine_admin_test_hint: "Send one test message to the selected project destination (or global settings). The message runs through the same slack queue and its execution appears in history."
  text_slackmine_admin_test_confirm: "Send one test notification to %{channel}?"
  text_slackmine_admin_test_message: "Slackmine test notification: checking queue processing and Slack posting from the administrator screen."
  text_slackmine_admin_test_queued: "Test notification queued. Check task history for the result."
  text_slackmine_admin_test_unavailable: "Check the destination, Bot settings and Sidekiq. Refresh this page if the destination has changed."
