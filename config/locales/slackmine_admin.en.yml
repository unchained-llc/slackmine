  label_slackmine_admin_changed: "Changed"
  label_slackmine_admin_changes_only: "Show changed values only"
  text_slackmine_admin_defaults: "Defaults are the values used by code when settings are omitted. Different current values are highlighted. Buttons depend on card type, individual custom fields on parent visibility settings, and upcoming reminder colors on slack.attachment_color, so these are not compared to a single value."
  label_slackmine_admin_channel: "Destination channel ID"
  label_slackmine_admin_mention: "Slack mention"
  label_slackmine_admin_match_method: "Match method"
  label_slackmine_admin_match_explicit_login: "Explicit mapping (login)"
  label_slackmine_admin_match_explicit_email: "Explicit mapping (email)"
  label_slackmine_admin_match_name: "Name match"
  label_slackmine_admin_match_email: "Email match"
  label_slackmine_admin_unmapped: "Not mapped"
  label_slackmine_admin_filter: "Show users"
  label_slackmine_admin_filter_mapped: "Mapped"
  label_slackmine_admin_filter_unmapped: "Unmapped"
  label_slackmine_admin_filter_all: "All"
  text_slackmine_admin_missing_configuration: "Configuration files are missing. Mappings may be unavailable and wording may fall back to English defaults. Check file placement:"
  label_slackmine_admin_mapping: "Configured user mappings (login or email)"
  text_slackmine_admin_settings: "Project overrides are merged with global settings. Display wording includes built-in defaults. Omitted operational settings use code defaults and are not listed here. SLACK_BOT_TOKEN precedence is reflected and tokens are masked."
  text_slackmine_admin_projects: "Uses actual notification routing, including parent inheritance, automatic name matching and the global fallback. Automatic matching may read Slack (cached for up to 10 minutes). This list does not check disabled events or successful delivery."
  text_slackmine_admin_users: "Defaults to mapped users; choose Unmapped or All to change the filter. Selecting a project limits the list to its active members. User mappings reflect explicit settings and enabled automatic name/email matching. This overview does not enable mention notifications. Failed or ambiguous automatic matches appear unmapped (cached for up to 10 minutes)."
  label_slackmine_admin_description: "Description"
  slackmine_admin_help:
    actions:
      created: "creation"
      updated: "update"
      deleted: "deletion"
      added: "addition"
      posted: "posting"
    default_rules:
      button: "Defaults apply when work_object_buttons is omitted entirely. When configured, omitted buttons are false. Actions and permissions must also allow display."
      custom_field: "Omitted entries inherit custom_fields.default (true when omitted). Notification display also requires the parent custom_fields setting."
      legacy_metadata: "A true parent event setting shows all fields; false hides them."
    defaults:
      button: "Notification: %{notification}; detail: %{detail}"
      upcoming: "Inherits slack.attachment_color (#6D5DFB when omitted)."
      custom_field: "Inherits default (true when omitted)"
      legacy_metadata: "When omitted: %{value}"
    event_color: "Notification color for %{target} %{action} events. Missing or invalid values use slack.attachment_color."
    slack_files_restrict_transfer: "Restrict image and attachment content transfers; preserve source URLs and conversation text."
    slack_files_force_restrict_transfer: "When true globally, enforce file transfer restrictions for every project. Project overrides cannot disable it."
    slack_link_cards_enabled: "Enable Slack link fetching, new quote imports and card displays. Existing quotes remain as text when false."
    slack_link_cards_redmine_enabled: "Display Slack quote cards in Redmine. Does not control quote imports or email cards."
    slack_link_cards_mail_enabled: "Show Slack quote cards and logos in HTML email; false keeps plain text."
    slack_link_cards_color: "Slack quote card color, expressed as a six-digit hexadecimal color beginning with #."
    slack_link_cards_link_text: "Legacy Slack link wording; messages.link_cards.open takes precedence."
    slack_slash_command: "Registered Slack slash command name, beginning with /. Disabled when omitted."
    slack_bot_token: "Slack Bot Token. Priority: project setting, SLACK_BOT_TOKEN, global setting. Values are masked."
    slack_default_channel_id: "Global fallback channel when explicit routing, parent inheritance and name matching do not resolve a destination. A project override is an explicit destination for that project."
    slack_use_slack_avatars: "Use Slack profile images for Redmine web avatars site-wide. Requires users:read and a shared web/worker Rails cache. Defaults to false."
    slack_auto_map_users_by_name: "Mention a unique Slack username or display-name match for the Redmine login. Explicit mappings take precedence. When name and email matching are both enabled, their YAML order determines priority."
    slack_auto_map_users_by_email: "Authorize Work Objects and thread replies by a unique registered email match. Also resolves outgoing and admin display identities. When name and email matching are both enabled, their YAML order determines priority. Mention notifications are enabled separately."
    slack_auto_map_channels_by_name: "Match project identifiers to Bot-member channel names, case-insensitively with spaces replaced by hyphens. Explicit destinations take precedence."
    slack_work_object_previews: "Add Task Work Object previews to issue creation, update and comment notifications. Requires Slack app preview configuration."
    slack_work_object_actions: "Enable issue actions on Work Object cards. User mappings and Redmine permissions are checked again on submission."
    slack_work_object_start_status_id: "Issue status ID used by Start work. Specify the actual ID, not the status name."
    slack_work_object_complete_status_id: "Issue status ID used by Complete work. Specify the actual ID, not the status name."
    slack_thread_comments: "Import replies to issue notification threads as Redmine comments. Requires user mappings, permissions and Slack events."
    slack_thread_connections: "Allow connecting a Slack conversation thread to an existing issue from the message menu."
    slack_suppress_thread_comment_notifications: "Suppress outgoing Slack notifications for comments imported from Slack threads to avoid duplicate posts."
    slack_thread_comment_batch_wait_seconds: "Seconds of silence before combining consecutive replies from the same author. Zero or omitted saves immediately."
    slack_thread_comment_batch_max_wait_seconds: "Maximum batch wait in seconds from the first reply. Defaults to 300 when omitted."
    slack_thread_comment_feedback_cleanup_seconds: "Seconds before deleting Bot import feedback: -1 keeps it, 0 suppresses it, positive values schedule deletion. Original replies and comments remain."
    slack_app_home: "Show personal open-issue lists in the Slack Home tab using the shared app configuration."
    slack_notification_coalescing_enabled: "Enable notification coalescing by editing the original post. False or omitted keeps separate notifications."
    slack_notification_coalescing_seconds: "Fixed window from the first post, defaulting to 5 minutes (300 seconds). Positive integer seconds are capped at 300; missing or invalid values use 300. No delivery delay or extension."
    slack_comment_notifications_in_threads: "Post comment-only changes to the latest issue notification thread; fall back to a regular notification when no thread is found."
    slack_events_app_id: "Slack app ID used to identify incoming events for this integration."
    slack_events_team_id: "Slack workspace ID used to identify incoming events for this integration."
    slack_events_signing_secret: "Secret used to verify Slack request signatures. Separate from the Bot Token; masked in this view."
    slack_body_diff: "Legacy overall switch for body diffs. Per-content-type switches are also supported."
    slack_attachment_color: "Slack notification attachment border color, expressed as a six-digit hexadecimal color beginning with #."
    slack_issue_changes_when_hidden: "Include changes to issue fields hidden from notification metadata in the change list."
    due_reminders_enabled: "Enable due-reminder DMs. Periodic delivery requires separately scheduling the rake task."
    due_reminders_days: "Days before the due date to begin reminders; defaults to 3 and includes overdue issues. A CLI days option takes precedence."
    due_reminders_colors_overdue: "Color used for overdue reminders."
    due_reminders_colors_today: "Color used for reminders due today."
    due_reminders_colors_upcoming: "Color used for upcoming reminders. Falls back to slack.attachment_color when omitted."
    channel_id: "Legacy explicit project channel ID. A project slack.default_channel_id takes precedence."
    messages_work_objects_product_name: "Service name shown in Work Objects and notifications, such as Example Tracker."
    messages_work_objects_display_type: "Object type label shown in Work Objects, such as Issue."
    events_issue_updated_enabled: "Parent switch for all issue detail update events. False disables individual detail events too; comment events are independent."
    button: "Show the %{action} Work Object button. In configuration order, the first two are primary buttons and the next five appear in More."
    card_field: "Show %{field} in the Work Object card body, independently of notification metadata."
    metadata: "Show %{field} in %{target} notification metadata."
    custom_field: "custom field ID %{id}"
    body_diff: "Show added and removed lines when %{field} changes in %{target}. Deleted comment diffs are shown regardless of this switch."
    event: "Send a Slack notification for %{event}. False disables this event."
    issue_event: "Send a Slack notification for %{event}, provided events.issue.updated.enabled is not false."
    user: "Slack user ID mapped to login or email %{user}. Takes precedence over automatic name matching."
    icon: "Icon used in %{target} notification headings."
    message: "Display wording for %{context}. Preserve the names of interpolation variables written as percent signs followed by braces."
    unknown: "Additional or legacy setting; see the configuration file or README for its behavior."
