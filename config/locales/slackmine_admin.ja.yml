  label_slackmine_admin_match_explicit_email: "明示設定（メールアドレス）"
  label_slackmine_admin_match_name: "名前一致"
  label_slackmine_admin_match_email: "メールアドレス一致"
  label_slackmine_admin_unmapped: "対応なし"
  label_slackmine_admin_filter: "表示対象"
