  label_slackmine_admin_jobs: "キュー・タスク"
  text_slackmine_admin_jobs: "キュー状態・実行履歴・テスト通知はSidekiq使用時のみ利用できます。Slackmineのジョブだけを表示します。履歴は機能追加後から直近100件・最大7日分です。「完了」はジョブ処理の完了で、通常通知の配信確認とは異なります。時刻は待機への登録・実行開始・予約実行・再試行・失敗・完了の各時刻です。"
  text_slackmine_admin_queue_summary: "slackキュー全体: %{count}件／待機時間: %{seconds}秒"
  text_slackmine_admin_jobs_truncated: "各キュー・予約・リトライ・失敗集合の先頭500件まで確認しています。表示件数は全件数ではありません。"
