  text_slackmine_admin_defaults: "デフォルト値はコードで設定省略時に使われる値です。異なる現在値を強調します。ボタンはカード種別、個別カスタムフィールドは親の表示設定、期日が近い通知の色はslack.attachment_colorに依存するため、単一の値と比較しません。"
