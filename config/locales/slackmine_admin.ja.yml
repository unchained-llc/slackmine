  label_slackmine_admin_filter_unmapped: "対応なし"
  label_slackmine_admin_filter_all: "すべて"
  text_slackmine_admin_missing_configuration: "実設定ファイルが見つかりません。対応設定が読み込まれず、文言は英語の既定値になる場合があります。設定ファイルの配置を確認してください："
  label_slackmine_admin_mapping: "設定済みのユーザー対応（ログイン名・メールアドレス）"
  text_slackmine_admin_settings: "選択したプロジェクトの上書きを共通設定に適用した値です。表示文言には組み込みの既定値も含みます。省略した動作設定はコードの既定値が適用され、この一覧には表示されません。SLACK_BOT_TOKEN の優先順位を反映し、トークンはマスクします。"
  text_slackmine_admin_projects: "実際の通知先解決処理による対応です。親プロジェクトの継承・名前による自動照合・共通の通知先を反映します。自動照合では Slack に読み取り問い合わせを行う場合があります（キャッシュは最大10分）。イベントの無効化や Slack への配信成功はこの一覧では判定しません。"
  text_slackmine_admin_users: "初期表示は対応ありのユーザーのみです。表示対象で対応なし・すべてに切り替えられます。プロジェクト選択時は、そのプロジェクトに所属する有効なユーザーだけを表示します。ユーザー対応は明示設定と、有効になっている名前・メールアドレスの自動照合を反映します。この一覧だけでメンション通知が有効になることはありません。自動照合が失敗・曖昧な場合は対応なしになります（キャッシュは最大10分）。"
  label_slackmine_admin_description: "解説"
  slackmine_admin_help:
    actions:
      created: "作成"
      updated: "更新"
      deleted: "削除"
      added: "追加"
      posted: "投稿"
