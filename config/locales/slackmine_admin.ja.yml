      button: "work_object_buttons全体を省略した場合の既定値です。設定を指定すると、省略したボタンはfalseになります。表示には操作の有効化・権限も必要です。"
      custom_field: "個別指定の省略時はcustom_fields.default（省略時true）を継承します。通知への表示には親のcustom_fields設定も必要です。"
      legacy_metadata: "親のイベント設定がtrueなら全項目を表示し、falseなら非表示にします。"
