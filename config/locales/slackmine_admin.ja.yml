      custom_field: "defaultを継承（省略時true）"
      legacy_metadata: "省略時: %{value}"
    event_color: "%{target}の%{action}イベントの通知色です。未指定・無効な値はslack.attachment_colorを使います。"
    slack_files_restrict_transfer: "画像・添付ファイルの内容を転送せず、元のURLを残します。会話テキストは引き続き転送します。"
    slack_files_force_restrict_transfer: "共通設定がtrueなら全プロジェクトでファイル転送を制限します。プロジェクト側で解除できません。"
    slack_link_cards_enabled: "Slackリンクの取得・新しい引用取り込み・カード表示を有効にします。falseでも既存の引用はテキストで残ります。"
    slack_link_cards_redmine_enabled: "Redmine画面でSlack引用カードを表示します。引用取り込みやメール表示には影響しません。"
    slack_link_cards_mail_enabled: "HTMLメールでSlack引用カードとロゴを表示します。falseならテキストで表示します。"
    slack_link_cards_color: "Slack引用カードの色です。#から始まる6桁の16進数を指定します。"
    slack_link_cards_link_text: "Slackリンクを開く文言の旧設定です。messages.link_cards.openの指定が優先されます。"
    slack_slash_command: "Slackに登録するスラッシュコマンド名です。/から始めます。未指定なら無効です。"
    slack_bot_token: "Slack APIのBot Tokenです。プロジェクト設定 → SLACK_BOT_TOKEN → 共通設定の順に優先し、値はマスクします。"
    slack_default_channel_id: "個別指定・親プロジェクトの継承・名前の自動照合で通知先が決まらない場合の共通チャンネルです。プロジェクト内の指定はそのプロジェクトの明示指定です。"
    slack_auto_map_users_by_name: "Redmineのログイン名をSlackのユーザー名・表示名と照合し、一意に一致した場合にメンションします。明示設定が優先されます。名前・メール照合が両方有効なら、YAMLで上に書いた設定から試します。"
    slack_auto_map_users_by_email: "登録メールアドレスの一意な一致でWork Objectやスレッド返信の権限を確認します。送信・管理画面のユーザー表示にも使います。名前・メール照合が両方有効なら、YAMLで上に書いた設定から試します。メンション通知の有効化は別設定です。"
    slack_auto_map_channels_by_name: "プロジェクト識別子をBot参加チャンネル名と照合します。空白はハイフンに変換し、大文字・小文字を区別しません。明示指定が優先されます。"
    slack_work_object_previews: "チケットの作成・更新・コメント通知にTask Work Objectプレビューを追加します。Slackアプリ側の設定も必要です。"
    slack_work_object_actions: "Work Objectカードでチケット編集などの操作を有効にします。実行時にユーザー対応とRedmineの権限を再確認します。"
    slack_work_object_start_status_id: "「作業開始」で変更するチケットステータスIDです。名前ではなく実際のIDを指定します。"
    slack_work_object_complete_status_id: "「作業完了」で変更するチケットステータスIDです。名前ではなく実際のIDを指定します。"
    slack_thread_comments: "チケット通知スレッドへのSlack返信をRedmineコメントとして取り込みます。ユーザー対応・権限・Slackイベント設定が必要です。"
    slack_thread_connections: "Slackのメッセージメニューから既存チケットに会話スレッドを接続できるようにします。"
    slack_suppress_thread_comment_notifications: "Slackから取り込んだコメントのSlack通知を抑制して、会話の重複投稿を防ぎます。"
    slack_thread_comment_batch_wait_seconds: "同じ人の連続返信をまとめる無発言待ち時間（秒）です。0または省略なら即時保存します。"
    slack_thread_comment_batch_max_wait_seconds: "返信をまとめる最大待ち時間（秒）です。最初の返信から数え、省略時は300秒です。"
    slack_thread_comment_feedback_cleanup_seconds: "Botの取り込み結果通知を消すまでの秒数です。-1で保持、0で通知しない、正の数で遅延削除します。元の返信やコメントは残ります。"
    slack_app_home: "SlackアプリのHomeタブに個人向けの未完了チケット一覧を表示します。共通アプリの設定を使います。"
